[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flood"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "pyarrow>=16", "scipy>=1.13",
  "rasterio>=1.4", "rio-cogeo>=5.3", "pyproj>=3.6", "shapely>=2.0",
  "geopandas>=1.0", "pyogrio>=0.9", "xarray>=2024.6", "h5netcdf>=1.3", "h5py>=3.10",
  "httpx>=0.27", "pydantic>=2.7", "jsonschema>=4.22", "referencing>=0.35",
  "fastapi>=0.111", "uvicorn>=0.30", "websockets>=12", "pillow>=10",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
[project.scripts]
flood = "flood.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"flood.contracts" = ["schemas/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet, skipped by default"]
addopts = "-m 'not network'"
